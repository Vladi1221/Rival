<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta
      name="description"
      content="RIVAL: desafíos personales para avanzar con intención."
    />
    <title>RIVAL — Superá tu marca</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegación principal">
        <a class="brand" href="#inicio" data-view="inicio" aria-label="RIVAL, inicio">
          <span class="brand-mark" aria-hidden="true">R</span>
          <span>RIVAL<span class="brand-period">.</span></span>
        </a>

        <div class="sidebar-label">MENÚ</div>
        <nav class="primary-nav">
          <button class="nav-link is-active" data-view="inicio">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z" /></svg></span>
            <span>Inicio</span>
          </button>
          <button class="nav-link" data-view="desafios">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 9 9-9 9-9-9z" /><path d="m12 8 4 4-4 4-4-4z" /></svg></span>
            <span>Desafíos</span>
            <span class="nav-count" id="active-count">0</span>
          </button>
          <button class="nav-link" data-view="ranking">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h17" /><path d="m7 15 4-4 3 2 6-7m0 0h-5m5 0v5" /></svg></span>
            <span>Ranking</span>
          </button>
          <button class="nav-link" data-view="comunidad">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 20l.9-4.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 7.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z" /></svg></span>
            <span>Comunidad</span>
          </button>
          <button class="nav-link" data-view="perfil">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg></span>
            <span>Mi perfil</span>
          </button>
        </nav>

        <div class="sidebar-bottom">
          <div class="sidebar-quote">
            <span class="quote-line"></span>
            <p>La única competencia<br />es con quien eras ayer.</p>
            <span class="quote-author">— RIVAL</span>
          </div>
          <div class="sidebar-user">
            <div class="avatar avatar-user">VL</div>
            <div class="sidebar-user-copy">
              <strong>Valen</strong>
              <span>Nivel 08 · En progreso</span>
            </div>
            <span class="online-dot" aria-label="Modo demostración"></span>
          </div>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <button class="mobile-brand" data-view="inicio" aria-label="Ir al inicio">
            <span class="brand-mark" aria-hidden="true">R</span> RIVAL<span class="brand-period">.</span>
          </button>
          <div class="breadcrumb"><span class="breadcrumb-kicker">PLATAFORMA DE PROGRESO</span><span class="breadcrumb-slash">/</span><strong id="current-section">INICIO</strong></div>
          <div class="topbar-right">
            <button class="auth-button" id="auth-action" data-action="open-auth">Conectar cuenta <span aria-hidden="true">→</span></button>
            <button class="top-avatar" data-view="perfil" aria-label="Abrir mi perfil">VL</button>
          </div>
        </header>

        <main id="main-content" tabindex="-1"></main>

        <footer class="mobile-nav" aria-label="Navegación móvil">
          <button class="mobile-nav-link is-active" data-view="inicio"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z" /></svg></span>Inicio</button>
          <button class="mobile-nav-link" data-view="desafios"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 9 9-9 9-9-9z" /></svg></span>Retos</button>
          <button class="mobile-nav-link" data-view="ranking"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h17" /><path d="m7 15 4-4 3 2 6-7m0 0h-5m5 0v5" /></svg></span>Ranking</button>
          <button class="mobile-nav-link" data-view="perfil"><span aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg></span>Perfil</button>
        </footer>
      </div>
    </div>

    <dialog class="challenge-dialog" id="challenge-dialog" aria-labelledby="dialog-title">
      <div id="dialog-content"></div>
    </dialog>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
